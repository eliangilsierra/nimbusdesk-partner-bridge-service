server:
  port: 8083

spring:
  application:
    name: nimbusdesk-partner-bridge-service
  profiles:
    active: ${PARTNER_BRIDGE_PROFILE:mysql}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
