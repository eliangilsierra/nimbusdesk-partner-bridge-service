# Shadows src/main/resources/application-mysql.yml on the test classpath, so
# tests run against in-memory H2 instead of a real MySQL server.
spring:
  datasource:
    url: jdbc:h2:mem:nimbusdesk;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
